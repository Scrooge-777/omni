[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-monitor"
version = "2.2.1"
description = "OMNI: laptop hardware telemetry, battery health, benchmarks and power tuning for Windows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Scrooge-777" }]
dependencies = [
    "psutil>=5.9",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
omni = "omni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omni = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
